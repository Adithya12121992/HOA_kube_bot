<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOA Bot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-dim: #2b4d8a;
    --good: #35c98f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .config-badge {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }
  .layout {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .sidebar {
    width: 220px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sidebar h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .toggle-group { display: flex; flex-direction: column; gap: 6px; }
  .toggle-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle-option:hover { background: #1d212c; }
  .toggle-option input { accent-color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }

  /* Chat panel */
  #chat-panel .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #chat-panel .messages:empty::before {
    content: "Ask a question about your uploaded documents.";
    color: var(--muted);
    font-size: 14px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.bot.pending { color: var(--muted); }
  .msg-sources { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .msg-source { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 6px; }
  .msg-meta { margin-top: 6px; font-size: 11px; color: var(--muted); }
  #chat-panel .composer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #chat-panel input[type="text"] {
    flex: 1;
    background: #0c0e13;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
  }
  #chat-panel button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #chat-panel button:disabled { background: var(--accent-dim); cursor: not-allowed; }

  /* Upload panel */
  #upload-panel { padding: 24px; overflow-y: auto; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .dropzone.dragover { border-color: var(--accent); color: var(--text); }
  #file-input { display: none; }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  #upload-status { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .upload-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .upload-item.success { border-color: var(--good); }
  .upload-item.error { border-color: #e05a5a; }
</style>
</head>
<body>

<header>
  <h1>HOA Bot</h1>
  <span class="config-badge" id="config-badge">loading config...</span>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="chat">Chat</button>
  <button class="tab-btn" data-tab="upload">Upload</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div>
      <h3>Environment</h3>
      <div class="toggle-group" id="environment-toggle">
        <label class="toggle-option">
          <input type="radio" name="environment" value="local" checked />
          Local (ChromaDB + LM Studio)
        </label>
        <label class="toggle-option">
          <input type="radio" name="environment" value="cloud" />
          Cloud (Pinecone + Claude/GPT)
        </label>
      </div>
    </div>
    <div>
      <h3>Retrieval Mode</h3>
      <div class="toggle-group" id="retrieval-toggle">
        <label class="toggle-option">
          <input type="radio" name="retrieval_mode" value="fast" checked />
          Fast
        </label>
        <label class="toggle-option">
          <input type="radio" name="retrieval_mode" value="thinking" />
          Thinking
        </label>
      </div>
    </div>
  </aside>

  <main>
    <section id="chat-panel" class="panel active">
      <div class="messages" id="chat-messages"></div>
      <div class="composer">
        <input type="text" id="chat-input" placeholder="Ask a question about your documents..." />
        <button id="chat-send">Send</button>
      </div>
    </section>

    <section id="upload-panel" class="panel">
      <div class="dropzone" id="dropzone">
        Drag & drop a PDF here, or
        <br /><br />
        <button class="btn" id="browse-btn">Choose File</button>
        <input type="file" id="file-input" accept="application/pdf" />
      </div>
      <div id="upload-status"></div>
      <div id="upload-history"></div>
    </section>
  </main>
</div>

<script>
  // Tab switching
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab + "-panel").classList.add("active");
    });
  });

  // Config load/update
  async function getConfig() {
    const res = await fetch("/config");
    const config = await res.json();
    document.getElementById("config-badge").textContent =
      `${config.environment} • ${config.retrieval_mode}`;
    document.querySelector(`input[name="environment"][value="${config.environment}"]`).checked = true;
    document.querySelector(`input[name="retrieval_mode"][value="${config.retrieval_mode}"]`).checked = true;
  }

  async function updateConfig(partial) {
    const res = await fetch("/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(partial),
    });
    const data = await res.json();
    document.getElementById("config-badge").textContent =
      `${data.config.environment} • ${data.config.retrieval_mode}`;
  }

  document.querySelectorAll('input[name="environment"]').forEach((el) => {
    el.addEventListener("change", (e) => updateConfig({ environment: e.target.value }));
  });
  document.querySelectorAll('input[name="retrieval_mode"]').forEach((el) => {
    el.addEventListener("change", (e) => updateConfig({ retrieval_mode: e.target.value }));
  });

  getConfig();

  // Upload
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const browseBtn = document.getElementById("browse-btn");
  const uploadStatus = document.getElementById("upload-status");
  const uploadHistory = document.getElementById("upload-history");

  browseBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) uploadFile(e.target.files[0]);
  });

  ["dragover", "dragenter"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  async function uploadFile(file) {
    uploadStatus.textContent = `Uploading ${file.name}...`;
    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/admin/upload", { method: "POST", body: formData });
      const data = await res.json();
      uploadStatus.textContent = "";
      if (res.ok) {
        const item = addHistoryItem(data.filename, "uploaded, queued for processing", true);
        item.dataset.docId = data.doc_id;
        pollStatus(data.doc_id, item);
      } else {
        addHistoryItem(file.name, data.detail || "Upload failed", false);
      }
    } catch (err) {
      uploadStatus.textContent = "";
      addHistoryItem(file.name, err.message, false);
    }
  }

  function addHistoryItem(filename, detail, success) {
    const item = document.createElement("div");
    item.className = "upload-item " + (success ? "success" : "error");
    item.innerHTML = `<span>${filename}</span><span class="detail">${success ? detail : "✗ " + detail}</span>`;
    uploadHistory.prepend(item);
    return item;
  }

  // Rebuilds upload history from the server on page load - every document's
  // status already persists as a file on the shared PVC (see
  // src/rag/status.py), so a page refresh doesn't have to lose track of
  // what's mid-upload; only the JS-side polling loop was ever in-memory-only.
  async function loadUploadHistory() {
    try {
      const res = await fetch("/status");
      if (!res.ok) return;
      const statuses = await res.json();

      // list_statuses() returns newest-first; addHistoryItem prepends, so
      // iterate oldest-first here to end up with newest-on-top, matching
      // how live uploads are added.
      for (const status of [...statuses].reverse()) {
        const item = addHistoryItem(status.filename, "", true);
        item.dataset.docId = status.doc_id;
        applyStatusToItem(item, status);
        if (!isTerminalStage(status.stage)) {
          pollStatus(status.doc_id, item);
        }
      }
    } catch (err) {
      // Upload tab just starts empty if this fails - not fatal, the user
      // can still upload new documents.
    }
  }

  const STAGE_LABELS = {
    uploaded: "Queued",
    extracting: "Extracting text",
    chunking: "Chunking",
    embedding: "Embedding",
    summarizing: "Summarizing",
    ready: "✓ Ready — you can ask questions about this doc",
    error: "✗ Failed",
  };

  function isTerminalStage(stage) {
    return stage === "ready" || stage === "error";
  }

  // Applies a status object to an already-rendered history item's DOM -
  // shared by the live poll loop and by rebuilding history from GET /status
  // on page load, so both paths render identically.
  function applyStatusToItem(item, status) {
    const detailEl = item.querySelector(".detail");
    let label = STAGE_LABELS[status.stage] || status.stage;
    if (status.stage === "embedding" && status.chunks_total) {
      label += ` (${status.chunks_done || 0}/${status.chunks_total})`;
    }
    if (status.stage === "error") {
      label = `✗ ${status.error_message || "Processing failed"}`;
    }
    detailEl.textContent = label;

    item.classList.remove("success", "error");
    if (status.stage === "ready") {
      item.classList.add("success");
      const existingSummary = item.querySelector(".item-summary");
      if (status.summary && !existingSummary) {
        const summaryEl = document.createElement("div");
        summaryEl.className = "item-summary";
        summaryEl.style.marginTop = "6px";
        summaryEl.style.color = "var(--muted)";
        summaryEl.style.fontSize = "12px";
        summaryEl.textContent = status.summary;
        item.appendChild(summaryEl);
      }
    } else if (status.stage === "error") {
      item.classList.add("error");
    }
  }

  function pollStatus(docId, item) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`/status/${docId}`);
        if (res.status === 404) return; // consumer hasn't started yet, keep polling
        const status = await res.json();

        applyStatusToItem(item, status);

        if (isTerminalStage(status.stage)) {
          clearInterval(interval);
        }
      } catch (err) {
        // transient fetch error - keep polling, don't give up on one failed request
      }
    }, 1500);
  }

  loadUploadHistory();

  // Chat
  const chatMessages = document.getElementById("chat-messages");
  const chatInput = document.getElementById("chat-input");
  const chatSend = document.getElementById("chat-send");

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    msg.textContent = text;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msg;
  }

  async function sendMessage() {
    const question = chatInput.value.trim();
    if (!question) return;

    addMessage("user", question);
    chatInput.value = "";
    chatInput.disabled = true;
    chatSend.disabled = true;
    const pending = addMessage("bot pending", "Thinking...");

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      pending.classList.remove("pending");
      pending.textContent = data.answer;

      if (data.sources && data.sources.length) {
        const sourcesEl = document.createElement("div");
        sourcesEl.className = "msg-sources";
        sourcesEl.innerHTML = data.sources
          .map((s, i) => `<div class="msg-source">[${i + 1}] ${s.source} (p.${s.page_start}-${s.page_end}, similarity ${s.similarity.toFixed(2)})</div>`)
          .join("");
        pending.appendChild(sourcesEl);
      }

      const metaEl = document.createElement("div");
      metaEl.className = "msg-meta";
      metaEl.textContent = `${data.metadata.latency_ms}ms • ${data.metadata.chunks_searched} chunks searched`;
      pending.appendChild(metaEl);
    } catch (err) {
      pending.classList.remove("pending");
      pending.textContent = `Error: ${err.message}`;
    } finally {
      chatInput.disabled = false;
      chatSend.disabled = false;
      chatInput.focus();
    }
  }

  chatSend.addEventListener("click", sendMessage);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
