<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOA Bot - File Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .upload-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .upload-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9ff;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 13px;
        }

        .upload-item.uploading {
            background: #fff3cd;
        }

        .upload-item.success {
            background: #d4edda;
        }

        .upload-item.error {
            background: #f8d7da;
        }

        .upload-status {
            font-size: 12px;
            color: #666;
        }

        .file-info {
            margin-top: 20px;
            padding: 12px;
            background: #f0f2ff;
            border-radius: 6px;
            color: #667eea;
            font-size: 13px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .btn-upload {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #ecfdf5;
            border: 1px solid #86efac;
            color: #166534;
        }

        .result.error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .result-content {
            font-size: 13px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow-y: auto;
        }

        .result-item {
            margin: 8px 0;
            padding: 4px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            margin-right: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 HOA Bot File Upload</h1>
        <p class="subtitle">Upload documents to be processed through the pipeline</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drag and drop your files here</div>
            <div class="upload-hint">or click to browse (multiple files supported)</div>
            <input type="file" id="fileInput" multiple>
        </div>

        <div class="file-info" id="fileInfo"></div>
        <div class="upload-list" id="uploadList"></div>

        <button class="btn-upload" id="uploadBtn" disabled>Upload Files</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Uploading and processing...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const uploadBtn = document.getElementById('uploadBtn');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');
        const uploadList = document.getElementById('uploadList');

        let selectedFiles = [];

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            updateFileInfo();
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            selectedFiles = Array.from(e.dataTransfer.files);
            fileInput.files = e.dataTransfer.files;
            updateFileInfo();
        });

        function updateFileInfo() {
            if (selectedFiles.length > 0) {
                const totalSize = selectedFiles.reduce((sum, f) => sum + f.size, 0);
                const totalSizeMB = (totalSize / (1024 * 1024)).toFixed(2);
                fileInfo.innerHTML = `
                    <strong>${selectedFiles.length} file(s) selected</strong> (${totalSizeMB} MB total)
                `;
                fileInfo.classList.add('show');

                // Show file list
                uploadList.innerHTML = selectedFiles.map((f, i) => `
                    <div class="upload-item">
                        <span>${f.name}</span>
                        <span class="upload-status">${(f.size / 1024 / 1024).toFixed(2)} MB</span>
                    </div>
                `).join('');

                uploadBtn.disabled = false;
            } else {
                fileInfo.classList.remove('show');
                uploadList.innerHTML = '';
                uploadBtn.disabled = true;
            }
        }

        uploadBtn.addEventListener('click', uploadFiles);

        async function uploadFiles() {
            if (selectedFiles.length === 0) return;

            uploadBtn.disabled = true;
            result.classList.remove('show');

            const results = [];
            const errors = [];

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];

                // Update UI for current file
                uploadList.innerHTML = selectedFiles.map((f, idx) => {
                    let status = '';
                    if (idx < i) status = '✓ Done';
                    else if (idx === i) status = '⏳ Uploading...';
                    else status = '⏳ Pending...';

                    return `
                        <div class="upload-item ${idx < i ? 'success' : idx === i ? 'uploading' : ''}">
                            <span>${f.name}</span>
                            <span class="upload-status">${status}</span>
                        </div>
                    `;
                }).join('');

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        results.push(data.data);
                    } else {
                        errors.push(`${file.name}: ${data.error}`);
                    }
                } catch (error) {
                    errors.push(`${file.name}: ${error.message}`);
                }
            }

            // Show results
            displayMultipleResults(results, errors);
            selectedFiles = [];
            fileInput.value = '';
            updateFileInfo();
            uploadBtn.disabled = false;
        }

        function displayMultipleResults(results, errors) {
            let html = '';

            if (results.length > 0) {
                html += `<div class="result success show">
                    <div class="result-title">✓ Successfully Uploaded ${results.length} file(s)</div>
                    <div class="result-content">`;

                results.forEach(r => {
                    html += `
                        <div class="result-item">
                            <div><span class="label">File:</span> ${r.original_filename}</div>
                            <div><span class="label">Path:</span> <code>${r.file_path}</code></div>
                            <div><span class="label">Doc ID:</span> <code>${r.doc_id}</code></div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            if (errors.length > 0) {
                html += `<div class="result error show">
                    <div class="result-title">✗ ${errors.length} upload(s) failed</div>
                    <div class="result-content">
                        ${errors.map(e => `<div class="result-item">${e}</div>`).join('')}
                    </div>
                </div>`;
            }

            result.innerHTML = html;
            result.classList.add('show');
        }

        function displaySuccess(data) {
            result.classList.add('success');
            result.classList.remove('error');
            result.innerHTML = `
                <div class="result-title">✓ File Uploaded Successfully!</div>
                <div class="result-content">
                    <div class="result-item">
                        <span class="label">Doc ID:</span>
                        <code>${data.doc_id}</code>
                    </div>
                    <div class="result-item">
                        <span class="label">Filename:</span>
                        <code>${data.original_filename}</code>
                    </div>
                    <div class="result-item">
                        <span class="label">Saved At:</span>
                        <code>${data.file_path}</code>
                    </div>
                    <div class="result-item">
                        <span class="label">Uploaded:</span>
                        <code>${data.uploaded_at}</code>
                    </div>
                </div>
            `;
            result.classList.add('show');
        }

        function displayError(error) {
            result.classList.add('error');
            result.classList.remove('success');
            result.innerHTML = `
                <div class="result-title">✗ Upload Failed</div>
                <div class="result-content">
                    ${error}
                </div>
            `;
            result.classList.add('show');
        }
    </script>
</body>
</html>
