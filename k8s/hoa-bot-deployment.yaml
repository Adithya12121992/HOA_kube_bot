apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoa-bot
  namespace: hoa-pipeline
  labels:
    app: hoa-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoa-bot
  template:
    metadata:
      labels:
        app: hoa-bot
    spec:
      containers:
      - name: hoa-bot
        image: hoa-bot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        # Configuration toggles
        - name: ENVIRONMENT
          value: "local"  # "local" or "cloud" - each is a full bundled stack
        - name: RETRIEVAL_MODE
          value: "fast"   # "fast" or "thinking"
        # RabbitMQ (for consumer coordination)
        - name: RABBITMQ_HOST
          value: "hoa-rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: hoa-rabbitmq-default-user
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hoa-rabbitmq-default-user
              key: password
        - name: RABBITMQ_QUEUE
          value: "test_queue"
        # --- Local environment stack ---
        - name: CHROMA_DB_PATH
          value: "/data/.chroma_data"
        - name: DATA_DIR
          value: "/data"
        - name: CHUNKS_JSON_PATH
          value: "/data/chunks.json"
        - name: LM_STUDIO_BASE_URL
          value: "http://host.k3d.internal:1234/v1"  # LM Studio runs on host machine; verified reachable from k3d pods
        - name: LM_STUDIO_MODEL
          value: "qwen/qwen3-14b"  # must match a model actually loaded in LM Studio
        - name: LM_STUDIO_API_KEY
          valueFrom:
            secretKeyRef:
              name: lmstudio-secret
              key: api-key
              optional: true
        # --- Cloud environment stack (only needed when ENVIRONMENT=cloud) ---
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pinecone-secret
              key: api-key
              optional: true
        - name: MEM0_API_KEY
          valueFrom:
            secretKeyRef:
              name: mem0-secret
              key: api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: openai-api-key
              optional: true
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: shared-storage
          mountPath: /data
        resources:
          # Same embedding model loaded here too (for /ask's query embedding),
          # plus FastAPI/uvicorn overhead - the original Phase 1 limit
          # (512Mi, before embedding was wired in) would OOM-kill this pod.
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: producer-consumer-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: hoa-bot-service
  namespace: hoa-pipeline
  labels:
    app: hoa-bot
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: hoa-bot
